          type: [integer, "null"]
          description: Sum of actual non-skipped CARDIO durationSeconds, including strength-classified sessions. Divide once by 60 for minutes; excludes plans, strength, breaths, rest and phase clocks. Null displays "Not available"; new empty periods are zero recorded activity.
