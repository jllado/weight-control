      type: object
      additionalProperties: false
      required: [id, updateToken, recordingKey, assessmentPresent, workout]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        updateToken: {type: integer, format: int64, minimum: 0, description: Revision to send with a full replacement; ordinary app edits advance it too.}
        recordingKey: {type: [string, "null"], format: uuid, description: UUID from the original recording, null for legacy records.}
        assessmentPresent: {type: boolean, description: A successful workout edit clears the assessment for its date.}
        workout: {$ref: "#/components/schemas/CoachWorkoutRecord"}
    CoachWorkoutRecord:
      type: object
      additionalProperties: false
      description: Full recorded evidence. Session duration is elapsed time, not exercise time, training load or proof of recovery; warm-up and stretching are not training load. Legacy cardio records remain valid.
      required: [id, sessionReference, workoutDateFormat, workoutDate, note, lines, startTime, endTime, durationMinutes, warmUpMinutes, trainingMinutes, stretchingMinutes, cardioMinutes, plannedSessionName, plannedTargets, saunaSession, saunaRoundsMinutes, plannedSaunaRoundsMinutes]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        sessionReference: {type: string}
        workoutDateFormat: {type: string}
        workoutDate: {type: string, format: date}
        note: {type: [string, "null"]}
        lines: {type: array, items: {$ref: "#/components/schemas/CoachWorkoutRecordedLine"}}
        startTime: {type: [string, "null"], description: Local HH:mm on workoutDate.}
        endTime: {type: [string, "null"], format: date-time, description: Absolute saved instant in ISO-8601 with Z or UTC offset; preserve the exact value on edit.}
        durationMinutes: {type: [integer, "null"], minimum: 1}
        warmUpMinutes: {type: [integer, "null"], minimum: 0}
        trainingMinutes: {type: [integer, "null"], minimum: 0}
        stretchingMinutes: {type: [integer, "null"], minimum: 0}
        cardioMinutes: {type: [integer, "null"], minimum: 0}
        plannedSessionName: {type: [string, "null"]}
        plannedTargets: {type: [array, "null"], items: {$ref: "#/components/schemas/RecordedPlanTargetSnapshot"}}
        saunaSession: {type: boolean}
        saunaRoundsMinutes: {type: [array, "null"], items: {type: integer, minimum: 1}, description: Actual ordered round minutes, never inferred from planned rounds; legacy non-sauna rows can be null.}
        plannedSaunaRoundsMinutes: {type: [array, "null"], items: {type: integer, minimum: 1}}
    CoachWorkoutRecordedLine:
      type: object
      additionalProperties: false
      required: [exerciseId, exerciseName, exerciseDescription, trackingMode, exerciseType, cardioMetric, position, calories, averageHeartRate, sets, intervals, stretchingUnit, supersetGroupId, exerciseDurationSeconds]
      properties:
        exerciseId: {type: integer, format: int64, minimum: 1}
        exerciseName: {type: string}
        exerciseDescription: {type: string}
        trackingMode: {type: string, enum: [REPS, SECONDS, CARDIO]}
        exerciseType: {type: string, enum: [TRAINING, WARM_UP, STRETCHING]}
        cardioMetric: {type: [string, "null"], enum: [SPEED_KPH, CADENCE_RPM, null]}
        position: {type: integer, minimum: 0}
        calories: {type: [integer, "null"], minimum: 0}
        averageHeartRate: {type: [integer, "null"], minimum: 0}
        sets: {type: array, items: {$ref: "#/components/schemas/CoachWorkoutRecordedSet"}}
        intervals: {type: array, items: {$ref: "#/components/schemas/CoachWorkoutRecordedInterval"}}
        stretchingUnit: {type: string, enum: [SECONDS, BREATHS]}
        supersetGroupId: {type: [string, "null"], maxLength: 36}
        exerciseDurationSeconds: {type: [integer, "null"], minimum: 0}
