openapi: 3.1.0
info:
  title: Weight Control Coach Action
  description: Discovers and reads scoped Weight Control health data, retrieves selected progress photos, manages confirmed records and coaching plans, assesses workouts, and preserves the reflection workflow.
  version: 1.12.0
servers:
  - url: https://weightcontrol.devjllado.com/api/chatgpt-actions
paths:
  /coach/catalog:
    get:
      operationId: getCoachCatalog
      summary: Discover available Weight Control health data
      description: Call before the first data-backed coaching answer to identify available domains and their date coverage without retrieving health records.
      responses:
        "200":
          description: Available Coach domains and coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachCatalog"
  /coach/context:
    get:
      operationId: getHealthContext
      summary: Get a minimal domain-scoped health context
      description: Returns only requested domains for an inclusive range up to 90 days. For oversized refreshes, request one domain per call and reuse the same from/to cutoff. Today is allowed even when the dashboard day is incomplete.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive context start date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive context end date in YYYY-MM-DD format. It cannot be in the future.
          schema:
            type: string
            format: date
        - name: domains
          in: query
          required: true
          description: One or more uppercase Coach domains as a comma-separated list.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CoachDomain"
        - name: foodQuery
          in: query
          required: false
          description: Use for each meal food to keep FOODS responses small. Case-insensitive name substring; returns at most 20 matches. Refine when matchedFoods exceeds 20. Does not filter DISHES or other domains.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: recordsPage
          in: query
          required: false
          description: Zero-based page applied independently to current and progression arrays when RECORDS is requested.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: recordsPageSize
          in: query
          required: false
          description: Maximum number of current records and progression events returned per RECORDS page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        "200":
          description: Requested health context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachContext"
        "400":
          description: Missing domains, invalid dates, invalid record pagination, a future end date, or a range longer than 90 inclusive days
  /coach/progress-photos:
    get:
      operationId: listProgressPhotos
      summary: List stored progress-photo metadata
      description: Lists photo-set dates, body values, and available sides without returning storage paths or image URLs. Call this before retrieving files.
      responses:
        "200":
          description: Stored progress-photo sets in newest-first order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressPhotoSet"
  /coach/progress-photos/{photoSetId}/files:
    get:
      operationId: getProgressPhotoFiles
      summary: Retrieve selected progress-photo files
      description: Returns five-minute signed URLs for one to three sides from one owned photo set. Retrieve only sides needed for the user's visual request.
      parameters:
        - name: photoSetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: sides
          in: query
          required: true
          description: One or more available sides as a comma-separated list.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 3
            uniqueItems: true
            items:
              $ref: "#/components/schemas/ProgressPhotoSide"
      responses:
        "200":
          description: Temporary URLs formatted for ChatGPT file retrieval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiFileResponse"
        "400":
          description: Missing or invalid side selection
        "404":
          description: Photo set or selected side not found for the authenticated user
  /coach/coach-notes:
    post:
      operationId: createCoachNote
      summary: Save a confirmed Coach Note
      description: Saves the dated note explicitly confirmed by the user. Coach Notes are returned only through the COACH_NOTES context domain.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachNoteWrite"
      responses:
        "200":
          description: Saved Coach Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachNote"
        "400":
          description: Invalid or unconfirmed note

  /coach/meals:
    get:
      operationId: getMeals
      summary: List meals for review or editing
      description: Returns owned meals and their resource IDs for an inclusive range of no more than 90 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Stored meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"
        "400":
          description: Invalid dates, a future end date, or a range longer than 90 inclusive days
    post:
      operationId: createMeal
      summary: Create a confirmed meal
      description: Creates the exact consumed meal and optional 1–10 Coach rating explicitly confirmed by the user; re-fetch with getMeals after success. For an attached image, send GPT_IMAGE_ESTIMATE and never send image bytes, ChatGPT file IDs, or image URLs.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealWrite"
      responses:
        "200":
          description: Created meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "400":
          description: Invalid values or missing explicit confirmation
  /coach/meals/{id}:
    put:
      operationId: updateMeal
      summary: Update a confirmed meal or its rating
      description: Retrieve getMeals first. MEAL replaces the full owned meal; preserve unchanged sibling foods, date, time, duration, source, rating and notes. RATING changes only its integer 1–10 score. Confirm exact values immediately before writing, then re-fetch with getMeals.
      x-openai-isConsequential: true
      parameters:
        - name: target
          in: query
          schema: {type: string, enum: [MEAL, RATING], default: MEAL}
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                date:
                  type: string
                  format: date
                mealType:
                  $ref: "#/components/schemas/MealType"
                durationMinutes:
                  type: integer
                  minimum: 1
                  description: Elapsed meal duration in minutes; fasting starts after this duration.
                mealTime:
                  type: string
                  format: time
                calories:
                  type: integer
                  minimum: 0
                proteinGrams:
                  type:
                    - number
                    - "null"
                  minimum: 0
                carbohydrateGrams:
                  type:
                    - number
                    - "null"
                  minimum: 0
                fatGrams:
                  type:
                    - number
                    - "null"
                  minimum: 0
                notes:
                  type:
                    - string
                    - "null"
                dishes:
                  type: array
                  items:
                    $ref: "#/components/schemas/CoachMealDishWrite"
                source:
                  $ref: "#/components/schemas/MealSource"
                confirmed:
                  type: boolean
                  const: true
                  description: Must be true only after the user explicitly confirms these exact values.
                rating:
                  type: integer
                  minimum: 1
                  maximum: 10
              anyOf:
                - {$ref: "#/components/schemas/MealWrite"}
                - {$ref: "#/components/schemas/MealRatingWrite"}
      responses:
        "200":
          description: Updated meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "400":
          description: Invalid values or missing explicit confirmation
        "404":
          description: Meal not found for the authenticated user
  /coach/meals/{id}/delete:
    post:
      operationId: deleteMeal
      summary: Delete a confirmed meal
      description: Deletes one owned meal after the user explicitly confirms deleting the exact record. Call getMeals first to obtain the resource ID.
      x-openai-isConsequential: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedWrite"
      responses:
        "200":
          description: Meal deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "400":
          description: Missing explicit confirmation
        "404":
          description: Meal not found for the authenticated user
  /coach/fasting-periods:
    get:
      operationId: getFastingPeriods
      summary: List fasting periods for review or editing
      description: Returns owned fasting periods and their resource IDs when they overlap an inclusive date range of no more than 90 days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Stored fasting periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FastingPeriod"
        "400":
          description: Invalid dates, a future end date, or a range longer than 90 inclusive days
    post:
      operationId: createFastingPeriod
      summary: Create a confirmed fasting period
      description: Creates the exact completed fasting period previously proposed to and explicitly confirmed by the user.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FastingPeriodWrite"
      responses:
        "200":
          description: Created fasting period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastingPeriod"
        "400":
          description: Invalid values, an overlapping period, or missing explicit confirmation
  /coach/fasting-periods/{id}:
    put:
      operationId: updateFastingPeriod
      summary: Update a confirmed fasting period
      description: Replaces one owned fasting period with the exact values explicitly confirmed by the user. Call getFastingPeriods first to obtain the resource ID.
      x-openai-isConsequential: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FastingPeriodWrite"
      responses:
        "200":
          description: Updated fasting period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FastingPeriod"
        "400":
          description: Invalid values, an overlapping period, or missing explicit confirmation
        "404":
          description: Fasting period not found for the authenticated user
  /coach/fasting-periods/{id}/delete:
    post:
      operationId: deleteFastingPeriod
      summary: Delete a confirmed fasting period
      description: Deletes one owned fasting period after the user explicitly confirms deleting the exact record. Call getFastingPeriods first to obtain the resource ID.
      x-openai-isConsequential: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedWrite"
      responses:
        "200":
          description: Fasting period deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "400":
          description: Missing explicit confirmation
        "404":
          description: Fasting period not found for the authenticated user
  /coach/health-constraints:
    get:
      operationId: getHealthConstraints
      summary: List health constraints for review or editing
      description: Returns active and inactive constraints with the resource IDs needed to update an existing constraint.
      responses:
        "200":
          description: Stored health constraints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthConstraint"
    post:
      operationId: createHealthConstraint
      summary: Create a confirmed health constraint
      description: Creates the exact health constraint previously proposed to and explicitly confirmed by the user.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthConstraintWrite"
      responses:
        "200":
          description: Created health constraint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthConstraint"
        "400":
          description: Invalid values or missing explicit confirmation
  /coach/health-constraints/{id}:
    put:
      operationId: updateHealthConstraint
      summary: Update a confirmed health constraint
      description: Replaces the editable fields of one owned constraint with the exact values explicitly confirmed by the user.
      x-openai-isConsequential: true
      parameters:
        - name: id
          in: path
          required: true
          description: Constraint resource ID returned by getHealthConstraints.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthConstraintWrite"
      responses:
        "200":
          description: Updated health constraint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthConstraint"
        "400":
          description: Invalid values or missing explicit confirmation
        "404":
          description: Constraint not found for the authenticated user
  /coach/active-plan:
    get:
      operationId: getActivePlan
      summary: Read the coaching plan, weekly workout editing context, or bounded exercise choices
      description: COACHING returns the goal and actions. WORKOUT without exerciseQuery returns the full weekly plan, token and catalog for plan edits. With exerciseQuery, returns matching exercises with IDs, no plan; refine broad queries.
      parameters:
        - name: target
          in: query
          schema: {type: string, enum: [COACHING, WORKOUT], default: COACHING}
        - name: exerciseQuery
          in: query
          required: false
          description: For WORKOUT completed-log exercise IDs, search a specific name fragment; returns only matching exercises, no plan. Refine if over 20 match. Omit for plan edits.
          schema: {type: string, minLength: 2}
      responses:
        "200":
          description: Coaching plan, weekly workout editing context, or bounded exercise choices
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: "#/components/schemas/CoachingPlan"}
                  - {$ref: "#/components/schemas/WorkoutPlanEditContext"}
                  - {$ref: "#/components/schemas/WorkoutExerciseSearchResult"}
        "204": {description: No active coaching plan for COACHING}
    put:
      operationId: updateActivePlan
      summary: Replace the confirmed coaching or weekly workout plan
      description: COACHING creates/replaces coaching plan. WORKOUT first/full-week replace; updateToken if editing, saunaSchemaVersion=1. Preserve sessions/targets/notes/sauna; dated before→after/reason in affected session/day note, retain old≤500c. Show full plan; exact confirm; reload/reconfirm conflicts.
      x-openai-isConsequential: true
      parameters:
        - name: target
          in: query
          schema: {type: string, enum: [COACHING, WORKOUT], default: COACHING}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmed
              properties:
                goal:
                  type: string
                  minLength: 1
                  maxLength: 255
                principles:
                  $ref: '#/components/schemas/CoachingPlanItems'
                priorities:
                  $ref: '#/components/schemas/CoachingPlanItems'
                actions:
                  $ref: '#/components/schemas/CoachingPlanItems'
                startDate:
                  type: string
                  format: date
                reviewDate:
                  type:
                  - string
                  - 'null'
                  format: date
                notes:
                  type:
                  - string
                  - 'null'
                confirmed:
                  type: boolean
                  const: true
                plan:
                  $ref: '#/components/schemas/WorkoutPlanRequest'
                updateToken:
                  type: string
                saunaSchemaVersion:
                  type: integer
                  const: 1
              anyOf:
                - {$ref: "#/components/schemas/CoachingPlanWrite"}
                - {$ref: "#/components/schemas/WorkoutPlanUpdate"}
      responses:
        "200":
          description: Saved coaching or weekly workout plan
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: "#/components/schemas/CoachingPlan"}
                  - {$ref: "#/components/schemas/WorkoutPlanResponse"}
        "400": {description: Invalid plan or missing explicit confirmation}
        "409": {description: Workout plan changed; reload and reconfirm}
  /coach/workouts/{workoutDate}/assessment-context:
    get:
      operationId: getWorkoutAssessmentContext
      summary: Get the evidence required to assess one workout
      description: Returns all dated sessions, weekly-plan applicability/day/targets and matching keys, active goal/constraints, assessment, and prior training. Missing evidence is unknown; consume each matching planned occurrence once. Token binds workouts and applicable plan versions. No account/database IDs.
      parameters:
        - name: workoutDate
          in: path
          required: true
          description: Stored workout date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Workout assessment evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutAssessmentContext"
        "400":
          description: No active coaching plan exists
        "404":
          description: Workout not found for the authenticated user
  /coach/workouts/{workoutDate}/assessment:
    put:
      operationId: saveWorkoutAssessment
      summary: Save a confirmed Coach workout assessment
      description: Creates or replaces one assessment covering all owned sessions on the date after the exact proposal is confirmed. Reload context when workoutContextToken or planUpdatedAt is stale.
      x-openai-isConsequential: true
      parameters:
        - name: workoutDate
          in: path
          required: true
          description: Stored workout date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutAssessmentWrite"
      responses:
        "200":
          description: Saved assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutAssessment"
        "400":
          description: Invalid scores or text, missing confirmation or active plan, or stale context timestamps
        "404":
          description: Workout not found for the authenticated user
  /coach/health-entries/{entryType}:
    get:
      operationId: getHealthEntries
      summary: List editable health entries by type
      description: Returns owned editable entries with IDs. DISH_RECIPE needs no dates; all other types require an inclusive range of at most 90 days. WORKOUT includes every recorded session, complete lines, actual and planned sauna rounds, and an updateToken. Read before updates.
      parameters:
        - name: entryType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/HealthEntryType" }
        - name: from
          in: query
          required: false
          description: Required for dated entry types; omit for DISH_RECIPE.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Required for dated entry types; omit for DISH_RECIPE.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Editable entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachHealthEntry"
    post:
      operationId: createHealthEntry
      summary: Create a confirmed health entry
      description: Creates the exact confirmed entry. DISH_RECIPE saves a reusable dish, not a meal. WORKOUT requires a new UUID recordingKey, complete session and actual sauna rounds; exact retries do not repeat side effects, and changed same-key payloads conflict. Re-fetch after success. No progress photo writes.
      x-openai-isConsequential: true
      parameters:
        - name: entryType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/HealthEntryType" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachHealthEntryWrite"
      responses:
        "200":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachHealthEntry"
        "400":
          description: Invalid values or missing explicit confirmation
        "409":
          description: WORKOUT recordingKey already belongs to another payload or a non-Coach recording.
  /coach/health-entries/{entryType}/{id}:
    put:
      operationId: updateHealthEntry
      summary: Replace a confirmed health entry
      description: For DISH_RECIPE, preserve the ordered recipe. For WORKOUT, read the full owned record and updateToken; confirm and send a full replacement preserving unchanged detail. A successful workout edit removes its date assessment. Re-fetch after success.
      x-openai-isConsequential: true
      parameters:
        - name: entryType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/HealthEntryType" }
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachHealthEntryWrite"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachHealthEntry"
        "400":
          description: Invalid values or missing explicit confirmation
        "404":
          description: Entry not found for the authenticated user
        "409":
          description: Stale WORKOUT updateToken; reload the full record before proposing another edit.
  /coach/sleeps:
    post:
      operationId: createSleep
      summary: Create a confirmed sleep entry
      description: Creates the exact sleep entry immediately confirmed by the user. Every duration value is a whole number of seconds; convert displayed hours and minutes before sending the request.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachSleepWrite"
      responses:
        "200":
          description: Created sleep entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepEntry"
        "400":
          description: Invalid values, duplicate sleep date, or missing explicit confirmation
  /coach/sleeps/{id}:
    put:
      operationId: updateSleep
      summary: Replace a confirmed sleep entry
      description: Replaces one owned sleep entry with the exact values immediately confirmed by the user. Use entry.id from getHealthEntries(entryType=SLEEP). Every duration value is a whole number of seconds.
      x-openai-isConsequential: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachSleepWrite"
      responses:
        "200":
          description: Updated sleep entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepEntry"
        "400":
          description: Invalid values, duplicate sleep date, or missing explicit confirmation
        "404":
          description: Sleep entry not found for the authenticated user
  /reflections/overview:
    get:
      operationId: getReflectionOverview
      summary: Get daily reflection dates or saved weekly summaries
      description: Omit target or use DAILY for completed daily dates. Use WEEKLY for independently saved weekly summaries.
      parameters:
        - name: target
          in: query
          required: false
          schema: {type: string, enum: [DAILY, WEEKLY], default: DAILY}
      responses:
        "200":
          description: Daily reflection history or weekly summary archive
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReflectionOverview"
                  - $ref: "#/components/schemas/WeeklyReflectionOverview"
  /reflections/{date}/context:
    get:
      operationId: getReflectionContext
      summary: Get daily context or the immutable snapshot for a saved weekly reflection
      description: Omit target or use DAILY for the existing dated context. Use WEEKLY with the summary Friday to retrieve only an owned saved summary and its current reflection.
      parameters:
        - name: date
          in: path
          required: true
          description: Completed dashboard date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: target
          in: query
          required: false
          description: WEEKLY treats date as the saved summary Friday; the default remains DAILY.
          schema: {type: string, enum: [DAILY, WEEKLY], default: DAILY}
      responses:
        "200":
          description: Structured reflection context
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReflectionContext"
                  - $ref: "#/components/schemas/WeeklyReflectionContext"
  /reflections/{date}:
    post:
      operationId: saveReflection
      summary: Save a daily reflection or a confirmed weekly reflection
      description: DAILY (default) requires summary ≤200 characters, findings ≤120 each and one general next action ≤200. WEEKLY has separate limits and confirmed payload. On validation failure, correct named fields and reconfirm changed text.
      x-openai-isConsequential: true
      parameters:
        - name: date
          in: path
          required: true
          description: Completed dashboard date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: target
          in: query
          required: false
          description: WEEKLY saves only the reflection for the owned saved summary ending on date.
          schema: {type: string, enum: [DAILY, WEEKLY], default: DAILY}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary]
              properties:
                title: {type: string, minLength: 1, maxLength: 80}
                summary: {type: string, minLength: 1, maxLength: 500, description: "DAILY maximum 200 characters; WEEKLY maximum 500 characters."}
                planProgressScore: {type: integer, minimum: 1, maximum: 10}
                planProgressRationale: {type: string, minLength: 1, maxLength: 120}
                meals: {$ref: "#/components/schemas/ReflectionWriteSection"}
                workouts: {$ref: "#/components/schemas/ReflectionWriteSection"}
                positiveSignals: {$ref: "#/components/schemas/InsightList"}
                watchouts: {$ref: "#/components/schemas/InsightList"}
                nextActions: {$ref: "#/components/schemas/DailyNextActionList"}
                confirmed: {type: boolean, enum: [true]}
                bodyComposition: {$ref: "#/components/schemas/WeeklyReflectionSection"}
                bloodPressure: {$ref: "#/components/schemas/WeeklyReflectionSection"}
                routines: {$ref: "#/components/schemas/WeeklyReflectionSection"}
                nutrition: {$ref: "#/components/schemas/WeeklyReflectionSection"}
                trainingRecovery: {$ref: "#/components/schemas/WeeklyReflectionSection"}
                goalProgress: {$ref: "#/components/schemas/WeeklyReflectionSection"}
                nextWeekActions:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: {type: string, minLength: 1, maxLength: 120}
              oneOf:
                - $ref: "#/components/schemas/SaveReflection"
                - $ref: "#/components/schemas/SaveWeeklyReflection"
      responses:
        "200":
          description: Saved reflection
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Reflection"
                  - $ref: "#/components/schemas/WeeklyReflection"
        "400":
          description: Invalid reflection; validation errors name fields and constraints without rejected values. Correct and reconfirm changed text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionValidationResponse"
  /coach/warnings:
    get:
      operationId: getCoachWarnings
      summary: Read active warnings, resolved history or review revisions
      parameters:
        - name: view
          in: query
          schema: {type: string, enum: [ACTIVE, HISTORY, REVISIONS], default: ACTIVE}
        - name: id
          in: query
          description: Required only for REVISIONS; obtain from a warning read.
          schema: {type: integer, format: int64}
        - name: page
          in: query
          description: Zero-based history or revision page, ten entries per page. ACTIVE returns every active warning.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Owned warnings and history availability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WarningReadResponse"}
    post:
      operationId: saveCoachWarning
      summary: Automatically create, update or resolve a Coach warning
      description: Send exactly one create, update or resolve payload. Include id only for update or resolve. Reuse a create UUID only for exact retries; updates and resolution require the retrieved version. No confirmation is required for warning writes.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WarningWriteRequest"}
      responses:
        "200":
          description: Saved warning
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WarningResponse"}
        "400":
          description: Invalid warning payload or operation combination
        "404":
          description: Warning not found for this user
        "409":
          description: Duplicate type, reused key, stale version, resolved warning or older review. Reload and reassess.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    WorkoutPlanUpdate:
      type: object
      additionalProperties: false
      required: [plan, confirmed, saunaSchemaVersion]
      properties:
        plan: {$ref: "#/components/schemas/WorkoutPlanRequest"}
        updateToken: {type: [string, "null"], description: Required for an existing workout plan; omit when creating the first plan.}
        confirmed: {type: boolean, const: true}
        saunaSchemaVersion: {type: integer, const: 1, description: Schema capability marker required for all Coach workout plan writes so older Actions cannot replace sauna plans.}
    WorkoutPlanSegment:
      type: object
      additionalProperties: false
      properties:
        repetitions: {type: [integer, "null"], minimum: 1}
        durationSeconds: {type: [integer, "null"], minimum: 5, multipleOf: 5}
        breaths: {type: [integer, "null"], minimum: 1}
        weight: {type: [number, "null"], minimum: 0}
        speedKph: {type: [number, "null"], minimum: 0}
        cadenceRpm: {type: [number, "null"], minimum: 0}
        distanceKm: {type: [number, "null"], minimum: 0}
        inclinePercent: {type: [number, "null"], minimum: 0}
        resistanceLevel: {type: [integer, "null"], minimum: 0}
      description: REPS requires repetitions and optional weight; SECONDS requires duration and optional weight; stretching uses durationSeconds with stretchingUnit SECONDS or positive integer breaths with stretchingUnit BREATHS; never combine or convert these units; CARDIO requires duration and optional distance, incline and resistance, plus speed except Elliptical, which uses cadenceRpm. Other fields must be null or omitted.
    WorkoutPlanLineRequest:
      type: object
      additionalProperties: false
      required: [exerciseId, segments]
      properties:
        stretchingUnit: {type: string, enum: [SECONDS, BREATHS], default: SECONDS, description: "Per-exercise hold unit; BREATHS is allowed only for STRETCHING. All holds share this unit."}
        exerciseId: {type: integer, format: int64}
        supersetGroupId: {type: [string, "null"], maxLength: 36, description: Shared ID groups adjacent exercises into a superset; members require equal segment counts.}
        segments:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/WorkoutPlanSegment"}
    WorkoutPlanDayRequest:
      type: object
      additionalProperties: false
      required: [day, rest, sessions]
      properties:
        day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        rest: {type: boolean}
        note: {type: [string, "null"], maxLength: 500, description: Day-level note retained for rest days; workout notes belong to sessions.}
        sessions:
          type: array
          items: {$ref: "#/components/schemas/WorkoutPlanSessionRequest"}
      description: Rest requires no sessions; each non-rest day has one or more sessions. Include each weekday exactly once.
    WorkoutPlanSessionRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        name: {type: [string, "null"], maxLength: 100}
        note: {type: [string, "null"], maxLength: 500}
        saunaSession: {type: boolean, description: True when this session includes sauna rounds. Preserve this flag when replacing a plan.}
        saunaRoundsMinutes:
          type: array
          items: {type: integer, minimum: 1}
          description: Ordered planned sauna round durations in whole minutes; required with saunaSession=true, otherwise empty. Preserve on plan replacement.
        lines:
          type: array
          items: {$ref: "#/components/schemas/WorkoutPlanLineRequest"}
      description: A named or unnamed independent workout session. At least one exercise or valid sauna round is required. Exercise IDs may repeat in different sessions but not within one session.
    WorkoutPlanRequest:
      type: object
      additionalProperties: false
      required: [startDate, reviewDate, days]
      properties:
        startDate: {type: string, format: date}
        reviewDate: {type: string, format: date}
        notes: {type: [string, "null"], maxLength: 500}
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: {$ref: "#/components/schemas/WorkoutPlanDayRequest"}
    PlannedExercise:
      type: object
      additionalProperties: false
      required: [exerciseName, exerciseDescription, trackingMode, exerciseType, segments]
      properties:
        stretchingUnit: {type: string, enum: [SECONDS, BREATHS], default: SECONDS, description: "Per-exercise hold unit; BREATHS is allowed only for STRETCHING. All holds share this unit."}
        exerciseName: {type: string}
        exerciseDescription: {type: string}
        trackingMode: {type: string, enum: [REPS, SECONDS, CARDIO]}
        exerciseType: {type: string, enum: [TRAINING, WARM_UP, STRETCHING]}
        segments:
          type: array
          items: {$ref: "#/components/schemas/WorkoutPlanSegment"}
        supersetGroupId: {type: [string, "null"], maxLength: 36}
    PlannedDay:
      type: object
      additionalProperties: false
      required: [day, rest, sessions]
      properties:
        day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        rest: {type: boolean}
        note: {type: [string, "null"], description: Rest-day note; workout notes belong to sessions.}
        sessions:
          type: array
          items: {$ref: "#/components/schemas/PlannedSession"}
    PlannedSession:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        name: {type: [string, "null"]}
        note: {type: [string, "null"]}
        saunaSession: {type: boolean}
        saunaRoundsMinutes:
          type: array
          items: {type: integer, minimum: 1}
        lines:
          type: array
          items: {$ref: "#/components/schemas/PlannedExercise"}
    PlannedWeek:
      type: object
      additionalProperties: false
      required: [startDate, reviewDate, days]
      properties:
        startDate: {type: string, format: date}
        reviewDate: {type: string, format: date}
        notes: {type: [string, "null"]}
        days:
          type: array
          items: {$ref: "#/components/schemas/PlannedDay"}
    WorkoutPlanContext:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan:
          anyOf:
            - {$ref: "#/components/schemas/PlannedWeek"}
            - {type: "null"}
      description: Current intended weekly schedule, independent of the requested historical dates. It is not evidence of completed workouts or historical adherence. Review dates do not expire the plan.
    WorkoutPlanResponse:
      type: object
      additionalProperties: false
      required: [id, startDate, reviewDate, days, createdAt, updatedAt, updateToken]
      properties:
        id: {type: integer, format: int64}
        startDate: {type: string, format: date}
        reviewDate: {type: string, format: date}
        notes: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        archivedAt: {type: [string, "null"], format: date-time}
        updateToken: {type: string}
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [day, rest, sessions]
            properties:
              day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
              rest: {type: boolean}
              note: {type: [string, "null"]}
              sessions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [lines]
                  properties:
                    name: {type: [string, "null"]}
                    note: {type: [string, "null"]}
                    saunaSession: {type: boolean}
                    saunaRoundsMinutes: {type: array, items: {type: integer, minimum: 1}}
                    lines:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [exerciseId, exerciseName, exerciseDescription, trackingMode, exerciseType, segments]
                        properties:
                          exerciseId: {type: integer, format: int64}
                          stretchingUnit: {type: string, enum: [SECONDS, BREATHS], default: SECONDS}
                          exerciseName: {type: string}
                          exerciseDescription: {type: string}
                          trackingMode: {type: string, enum: [REPS, SECONDS, CARDIO]}
                          exerciseType: {type: string, enum: [TRAINING, WARM_UP, STRETCHING]}
                          cardioMetric: {type: [string, "null"], enum: [SPEED_KPH, CADENCE_RPM, null]}
                          supersetGroupId: {type: [string, "null"], maxLength: 36}
                          segments:
                            type: array
                            items: {$ref: "#/components/schemas/WorkoutPlanSegment"}
    WorkoutPlanEditContext:
      type: object
      additionalProperties: false
      required: [plan, exercises]
      properties:
        plan:
          anyOf:
            - {$ref: "#/components/schemas/WorkoutPlanResponse"}
            - {type: "null"}
        exercises:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, description, trackingMode, exerciseType]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
              description: {type: string}
              trackingMode: {type: string, enum: [REPS, SECONDS, CARDIO]}
              exerciseType: {type: string, enum: [TRAINING, WARM_UP, STRETCHING]}
              cardioMetric: {type: [string, "null"], enum: [SPEED_KPH, CADENCE_RPM, null]}
    WorkoutPlanExerciseChoice:
      type: object
      additionalProperties: false
      required: [id, name, description, trackingMode, exerciseType]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string}
        trackingMode: {type: string, enum: [REPS, SECONDS, CARDIO]}
        exerciseType: {type: string, enum: [TRAINING, WARM_UP, STRETCHING]}
        cardioMetric: {type: [string, "null"], enum: [SPEED_KPH, CADENCE_RPM, null]}
    WorkoutExerciseSearchResult:
      type: object
      additionalProperties: false
      description: Bounded exercise-name lookup for completed workout logs. The current weekly plan is intentionally absent; use the ordinary WORKOUT read for plan edits.
      required: [query, exercises]
      properties:
        query: {type: string, minLength: 2}
        exercises: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/WorkoutPlanExerciseChoice"}}
    CoachDomain:
      type: string
      enum:
        - PROFILE
        - BODY
        - VITALS
        - NUTRITION
        - DISHES
        - FOODS
        - TRAINING
        - WORKOUT_PLAN
        - RECOVERY
        - BEHAVIOR
        - HEALTH_EVENTS
        - HEALTH_CONSTRAINTS
        - ACTIVE_PLAN
        - DECISIONS
        - RECORDS
        - REFLECTIONS
        - PROGRESS_PHOTOS
        - COACH_NOTES
    CoachCatalog:
      type: object
      additionalProperties: false
      required:
        - timezone
        - currentLocalDateTime
        - domains
      properties:
        timezone:
          type: string
          example: Europe/Madrid
        currentLocalDateTime:
          type: string
          format: date-time
        lastCompletedDate:
          type:
            - string
            - "null"
          format: date
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainAvailability"
    DomainAvailability:
      type: object
      additionalProperties: false
      required:
        - domain
        - recordCount
      properties:
        domain:
          $ref: "#/components/schemas/CoachDomain"
        recordCount:
          type: integer
          format: int64
          minimum: 0
        firstDate:
          type:
            - string
            - "null"
          format: date
        lastDate:
          type:
            - string
            - "null"
          format: date
    CoachContext:
      type: object
      additionalProperties: false
      required:
        - timezone
        - currentLocalDateTime
        - from
        - to
        - endDateComplete
        - dataSemantics
        - data
      properties:
        timezone:
          type: string
          example: Europe/Madrid
        currentLocalDateTime:
          type: string
          format: date-time
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        lastCompletedDate:
          type:
            - string
            - "null"
          format: date
        endDateComplete:
          type: boolean
          description: True when the requested end date is no later than the last completed dashboard date.
        dataSemantics:
          $ref: "#/components/schemas/CoachDataSemantics"
        data:
          $ref: "#/components/schemas/CoachContextData"
    CoachDataSemantics:
      type: object
      additionalProperties: false
      required:
        - absentRecordsAreUnknown
        - recordedZeroCaloriesAreValid
        - requestedRangeIsInclusive
        - absentBackPainEpisodesMeanNoProblem
      properties:
        absentRecordsAreUnknown:
          type: boolean
          const: true
        recordedZeroCaloriesAreValid:
          type: boolean
          const: true
        requestedRangeIsInclusive:
          type: boolean
          const: true
        absentBackPainEpisodesMeanNoProblem:
          type: boolean
          const: true
          description: An absent back-pain episode means no back-pain problem for the returned date range.
    CoachContextData:
      type: object
      additionalProperties: false
      description: Contains only the domains requested through the domains query parameter. DISHES and FOODS return current catalogs regardless of the validated date range.
      properties:
        PROFILE:
          $ref: "#/components/schemas/Profile"
        BODY:
          $ref: "#/components/schemas/BodyContext"
        VITALS:
          $ref: "#/components/schemas/VitalsContext"
        NUTRITION:
          $ref: "#/components/schemas/NutritionContext"
        DISHES:
          $ref: "#/components/schemas/DishesContext"
        FOODS:
          $ref: "#/components/schemas/FoodsContext"
        WORKOUT_PLAN:
          $ref: "#/components/schemas/WorkoutPlanContext"
        TRAINING:
          $ref: "#/components/schemas/CoachWorkoutContext"
        RECOVERY:
          $ref: "#/components/schemas/RecoveryContext"
        BEHAVIOR:
          $ref: "#/components/schemas/BehaviorContext"
        HEALTH_EVENTS:
          $ref: "#/components/schemas/HealthEventsContext"
        HEALTH_CONSTRAINTS:
          $ref: "#/components/schemas/HealthConstraintsContext"
        ACTIVE_PLAN:
          $ref: "#/components/schemas/ActivePlanContext"
        DECISIONS:
          $ref: "#/components/schemas/DecisionsContext"
        RECORDS:
          $ref: "#/components/schemas/RecordsContext"
        REFLECTIONS:
          $ref: "#/components/schemas/ReflectionsContext"
        PROGRESS_PHOTOS:
          $ref: "#/components/schemas/ProgressPhotosContext"
        COACH_NOTES:
          $ref: "#/components/schemas/CoachNotesContext"
    RecordsContext:
      type: object
      additionalProperties: false
      required:
        - current
        - progression
        - page
        - pageSize
        - currentTotal
        - progressionTotal
        - hasMore
      properties:
        current:
          type: array
          items:
            $ref: "#/components/schemas/CoachRecord"
        progression:
          type: array
          description: Source-derived record events whose dates fall inside the requested inclusive range; routine events contain streak milestones while current routine records remain exact.
          items:
            $ref: "#/components/schemas/CoachRecordEvent"
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        currentTotal:
          type: integer
          format: int64
          minimum: 0
        progressionTotal:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean
          description: True when either current records or progression events have another page.
    CoachRecord:
      type: object
      additionalProperties: false
      required:
        - metric
        - metricLabel
        - domain
        - direction
        - value
        - unit
        - subjectType
        - subjectLabel
      properties:
        metric:
          type: string
        metricLabel:
          type: string
        domain:
          type: string
        direction:
          type: string
          enum: [MINIMUM, MAXIMUM]
        value:
          type: number
        unit:
          type: string
        recordDate:
          type: [string, "null"]
          format: date
        subjectType:
          type: string
        subjectLabel:
          type: string
        qualifierLabel:
          type: [string, "null"]
    CoachRecordEvent:
      type: object
      additionalProperties: false
      required:
        - metric
        - metricLabel
        - domain
        - direction
        - kind
        - value
        - unit
        - recordDate
        - currentRecord
        - subjectType
        - subjectLabel
      properties:
        metric:
          type: string
        metricLabel:
          type: string
        domain:
          type: string
        direction:
          type: string
          enum: [MINIMUM, MAXIMUM]
        kind:
          type: string
          enum: [FIRST, IMPROVED, TIED]
        value:
          type: number
        previousValue:
          type: [number, "null"]
        unit:
          type: string
        recordDate:
          type: string
          format: date
        currentRecord:
          type: boolean
        subjectType:
          type: string
        subjectLabel:
          type: string
        qualifierLabel:
          type: [string, "null"]
    CoachNoteWrite:
      type: object
      additionalProperties: false
      required: [date, content, confirmed]
      properties:
        date: {type: string, format: date}
        content: {type: string, minLength: 1, maxLength: 4000}
        confirmed: {type: boolean, const: true}
    CoachNote:
      type: object
      additionalProperties: false
      required: [id, date, content]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        date: {type: string, format: date}
        content: {type: string}
    CoachNotesContext:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, content]
            properties:
              date: {type: string, format: date}
              content: {type: string}
    ProgressPhotoSide:
      type: string
      enum:
        - FRONT
        - LEFT
        - RIGHT
    ProgressPhotosContext:
      type: object
      additionalProperties: false
      required:
        - photoSets
      properties:
        photoSets:
          type: array
          items:
            $ref: "#/components/schemas/ProgressPhotoSet"
    ProgressPhotoSet:
      type: object
      additionalProperties: false
      required:
        - photoSetId
        - date
        - weightKg
        - fatPercentage
        - fatMassKg
        - muscleMassKg
        - musclePercentage
        - availableSides
      properties:
        photoSetId:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
        weightKg:
          type: number
        fatPercentage:
          type: number
        fatMassKg:
          type: number
        muscleMassKg:
          type: number
        musclePercentage:
          type: number
        availableSides:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ProgressPhotoSide"
    OpenAiFileResponse:
      type: object
      additionalProperties: false
      required:
        - openaiFileResponse
      properties:
        openaiFileResponse:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            format: uri
          description: Five-minute URLs pointing to the selected progress-photo files.
    BodyContext:
      type: object
      additionalProperties: false
      required:
        - measurements
      properties:
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/BodyMeasurement"
    BodyMeasurement:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        weightKg:
          type: number
        fatPercentage:
          type: number
        fatMassKg:
          type: number
        muscleMassKg:
          type: number
        musclePercentage:
          type: number
        weightChangeKg:
          type: number
        fatChangeKg:
          type: number
        muscleChangeKg:
          type: number
        performanceWeek:
          $ref: "#/components/schemas/PerformanceWeek"
    VitalsContext:
      type: object
      additionalProperties: false
      required:
        - bloodPressures
        - lipidPanels
      properties:
        bloodPressures:
          type: array
          items:
            $ref: "#/components/schemas/BloodPressure"
        lipidPanels:
          type: array
          items:
            $ref: "#/components/schemas/LipidPanel"
    DishesContext:
      type: object
      additionalProperties: false
      description: Current saved recipes, sorted by name, independent of the requested dates. These are templates, not consumed meals.
      required: [dishes]
      properties:
        dishes:
          type: array
          items:
            $ref: "#/components/schemas/SavedDish"
    SavedDish:
      type: object
      additionalProperties: false
      required: [name, servings, ingredients]
      properties:
        name:
          type: string
        servings:
          type: number
          exclusiveMinimum: 0
          description: Serving yield of the full recipe; ingredient quantities and nutrition describe this entire yield.
        ingredients:
          type: array
          description: Ordered independent food snapshots; scale quantities by requested servings divided by recipe yield, then scale nutrients from their references.
          items:
            $ref: "#/components/schemas/NutritionDish"
    FoodsContext:
      type: object
      additionalProperties: false
      description: Current active food catalog, sorted by name, independent of the requested dates. Entries are reusable portions, not consumption; null macros are unknown.
      required: [foods, matchedFoods]
      properties:
        matchedFoods:
          type: integer
          description: Total matches before the foodQuery limit; refine the query if greater than the returned foods count.
        foods:
          type: array
          items:
            $ref: "#/components/schemas/NutritionDish"
    NutritionContext:
      type: object
      additionalProperties: false
      required:
        - dailyTotals
        - targets
        - plannedCalorieTargets
        - weeklyAverageCalorieMaximum
      properties:
        dailyTotals:
          type: array
          description: Compact daily nutrition evidence for broad reviews. Use getMeals or getFastingPeriods only when individual entries are needed.
          items:
            $ref: "#/components/schemas/NutritionDailyTotal"
        targets:
          $ref: "#/components/schemas/NutrientTargets"
        plannedCalorieTargets:
          type: array
          description: Effective dated calorie goals for the requested range. A saved weekly plan takes precedence; otherwise the weekday profile target applies.
          items:
            $ref: "#/components/schemas/PlannedCalorieTarget"
        weeklyAverageCalorieMaximum:
          type: integer
