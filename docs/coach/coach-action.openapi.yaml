          description: AVAILABLE is one owner-owned plan within start/review dates, known by Madrid midnight and not archived during the day. Same-day lifecycle changes or multiple candidates are AMBIGUOUS; later edits are HISTORICAL_VERSION_UNAVAILABLE. Other statuses provide no expected day.
