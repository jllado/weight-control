      properties:
        workoutCount:
          type: integer
          description: Legacy overall count; weekly activity uses category session counts instead.
        totalDurationSeconds:
          type: integer
          description: Legacy combined training-segment time; use activeCardioSeconds for active cardio.
        totalDistanceKm:
          type: number
        totalCalories:
          type: integer
        strengthVolumeKg:
          type: number
        durationReadingCount:
          type: integer
        distanceReadingCount:
          type: integer
        calorieReadingCount:
          type: integer
        strengthSetCount:
          type: integer
        strengthSessionCount:
          type: [integer, "null"]
          description: Recorded sessions with performed TRAINING REPS/SECONDS; strength takes precedence over cardio and stretching. Null in legacy snapshots displays "Not available".
        cardioSessionCount:
          type: [integer, "null"]
          description: Recorded sessions with performed TRAINING CARDIO and no strength; precedes stretching. Same-date sessions count separately; null displays "Not available".
        stretchingSessionCount:
          type: [integer, "null"]
          description: Recorded sessions with performed STRETCHING and no strength/cardio. Warm-up-only, sauna-only and skipped-only sessions are excluded. Null displays "Not available".
