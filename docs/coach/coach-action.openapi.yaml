      properties:
        position: {type: integer, minimum: 0}
        repetitions: {type: [integer, "null"], minimum: 1}
        durationSeconds: {type: [integer, "null"], minimum: 1}
        weight: {type: [number, "null"], minimum: 0}
        breaths: {type: [integer, "null"], minimum: 1}
        skipped: {type: boolean}
    CoachWorkoutRecordedInterval:
      type: object
      additionalProperties: false
      required: [position, durationSeconds, speedKph, cadenceRpm, distanceKm, inclinePercent, resistanceLevel, skipped]
      properties:
        position: {type: integer, minimum: 0}
        durationSeconds: {type: [integer, "null"], minimum: 1}
        speedKph: {type: [number, "null"], minimum: 0}
        cadenceRpm: {type: [number, "null"], minimum: 0}
        distanceKm: {type: [number, "null"], minimum: 0}
        inclinePercent: {type: [number, "null"], minimum: 0}
        resistanceLevel: {type: [integer, "null"], minimum: 0}
        skipped: {type: boolean}
    CoachDishRecipeEntry:
      type: object
      description: An owned reusable dish with its saved, ordered ingredient snapshots. Only this editable read exposes its ID.
      required: [id, name, servings, ingredients]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        servings: { type: number, exclusiveMinimum: 0, maximum: 99999999.999, multipleOf: 0.001 }
        ingredients:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CoachDishRecipeIngredient" }
    CoachDishRecipeWrite:
      type: object
      additionalProperties: false
      description: Full reusable dish replacement; preserve each unchanged ingredient, its position and all saved nutrition/reference/fruit fields from the editable read.
      required: [name, servings, ingredients, nutrientSchemaVersion]
      properties:
        nutrientSchemaVersion: {type: integer, const: 2, description: Aware replacement of nullable EPA+DHA, ALA, and fiber ingredient snapshots.}
        name: { type: string, minLength: 1, maxLength: 255 }
        servings: { type: number, exclusiveMinimum: 0, maximum: 99999999.999, multipleOf: 0.001 }
        ingredients:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CoachDishRecipeIngredient" }
    CoachDishRecipeIngredient:
      type: object
      additionalProperties: false
      required: [name, calories, proteinGrams, carbohydrateGrams, fatGrams, quantity, unit, fruit, vitaminDMicrograms, magnesiumMilligrams, nutrientSource, nutrientsEstimated, epaDhaMilligrams, epaDhaSource, epaDhaEstimated, alaMilligrams, alaSource, alaEstimated, fiberGrams, fiberSource, fiberEstimated]
      properties:
        nutrientSchemaVersion: {type: [integer, "null"], enum: [2, null]}
        name: { type: string, minLength: 1, maxLength: 255 }
        calories: { type: integer, minimum: 0 }
        proteinGrams: { type: [number, "null"], minimum: 0 }
        carbohydrateGrams: { type: [number, "null"], minimum: 0 }
        fatGrams: { type: [number, "null"], minimum: 0 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 99999999.999, multipleOf: 0.001 }
        unit: { type: string, enum: [GRAM, MILLILITRE, SERVING, UNIT] }
        reference: { $ref: "#/components/schemas/DishReferenceWrite" }
        fruit:
          type: boolean
          description: Explicitly classify clear fruit as true even when a reused catalog food says false; preserve the saved value for unchanged ingredients.
        vitaminDMicrograms: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        omega3Milligrams: { type: [number, "null"], minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        magnesiumMilligrams: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        nutrientSource: { type: string, minLength: 1, maxLength: 500 }
        nutrientsEstimated: { type: boolean }
        epaDhaMilligrams: {type: [number, "null"], minimum: 0, maximum: 99999999.99, multipleOf: 0.01}
        epaDhaSource: {type: [string, "null"], maxLength: 500}
        epaDhaEstimated: {type: [boolean, "null"]}
        alaMilligrams: {type: [number, "null"], minimum: 0, maximum: 99999999.99, multipleOf: 0.01}
        alaSource: {type: [string, "null"], maxLength: 500}
        alaEstimated: {type: [boolean, "null"]}
        fiberGrams: {type: [number, "null"], minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "Fiber in grams for this portion. Reuse known saved values; research missing fiber from the product label or a matching composition source even for saved foods. Confirm estimates with source and matching reference fiber. Unsupported stays null; zero requires evidence. Do not alter saved templates or history without authorization."}
        fiberSource: {type: [string, "null"], maxLength: 500}
        fiberEstimated: {type: [boolean, "null"]}
    CoachHealthEntryWrite:
      type: object
      description: Send every field required by the selected path type. DISH_RECIPE uses the nested full recipe. WORKOUT uses nested workout; create requires its UUID recordingKey, and update requires the current updateToken beside workout. All writes require confirmed=true. WEIGHT date accepts YYYY-MM-DD at the start of that date in Europe/Madrid, or an ISO-8601 offset timestamp; other types use their documented date/date-time formats. BACK_PAIN_EPISODE update omits date because it cannot change. BACK_PAIN_EPISODE severity NONE requires null region and side and must be the only entry for its date and period; other severities require a location.
      required: [confirmed]
      properties:
        recipe: { $ref: "#/components/schemas/CoachDishRecipeWrite" }
        workout: {$ref: "#/components/schemas/CoachWorkoutWrite"}
        updateToken: {type: integer, format: int64, minimum: 0, description: Required only for WORKOUT update; use the latest editable read token.}
        date: { type: string }
        sleepDate: { type: string, format: date }
        weight: { type: number, minimum: 0, description: "Body weight in kg; convert source mass units to kg and round half-up to 2 decimals." }
        fatPercentage: { type: number, minimum: 0, description: "Body fat percentage, not mass. If only fat mass is displayed, fat kg / weight kg × 100; round half-up to 2 decimals." }
        muscle: { type: number, minimum: 0, description: "Total muscle mass in kg, not skeletal muscle or fat-free mass. If only total muscle % is displayed, weight kg × muscle % / 100; round half-up to 2 decimals." }
        upper: { type: integer }
        lower: { type: integer }
        period: { $ref: "#/components/schemas/MoodPeriod" }
        value: { type: integer, minimum: 1, maximum: 5 }
        bedtimeStart: { type: string, format: date-time }
        bedtimeEnd: { type: string, format: date-time }
        totalSleepDuration: { type: integer, minimum: 0 }
        deepSleepDuration: { type: integer, minimum: 0 }
        remSleepDuration: { type: integer, minimum: 0 }
        lightSleepDuration: { type: integer, minimum: 0 }
        awakeTime: { type: integer, minimum: 0 }
        averageHeartRate: { type: number, minimum: 0 }
        averageHrv: { type: integer, minimum: 0 }
        region: { type: [string, "null"], enum: [UPPER, MIDDLE, LOWER, null] }
        side: { type: [string, "null"], enum: [LEFT, CENTER, RIGHT, null] }
        severity: { type: string }
        type: { type: string }
        totalCholesterol: { type: integer, minimum: 1 }
        hdlCholesterol: { type: integer, minimum: 1 }
        ldlCholesterol: { type: integer, minimum: 1 }
        triglycerides: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
        confirmed: { type: boolean, const: true }
    CoachWorkoutWrite:
      type: object
      additionalProperties: false
      required: [workoutDate, lines, saunaSession]
      description: Full completed session, not a future workout plan. On edit, copy every unchanged recorded field, ordered line/set/interval, exact second, skip, time, note and planned snapshot from the full read; other sessions on that date remain separate and untouched. Omit recordingKey only when updating a legacy row that has none. An exact create retry must reuse the same key and full payload; any changed same-key payload conflicts. Ask for actual positive ordered sauna round minutes, never substitute planned rounds. A sauna-only session needs no exercise. Count actual rounds once; elapsed duration must cover them and is not exercise time, training load or proof of recovery. Warm-up and stretching are not training load. Legacy cardio records remain valid.
      properties:
        workoutDate: {type: string, format: date, description: Recorded date in Europe/Madrid; future dates are rejected.}
        note: {type: [string, "null"], maxLength: 500}
        lines: {type: array, items: {$ref: "#/components/schemas/CoachWorkoutLineWrite"}}
        startTime: {type: [string, "null"], description: Local HH:mm on workoutDate.}
        endTime: {type: [string, "null"], format: date-time, description: Optional full ISO-8601 date-time with Z or UTC offset, e.g. 2026-10-24T11:11:00Z. Never send HH:mm such as 13:11; omit if only local clock time is known, and do not infer an instant from duration. Preserve the saved value on edit.}
        durationMinutes: {type: [integer, "null"], minimum: 1, description: Elapsed duration must cover all actual sauna rounds.}
        warmUpMinutes: {type: [integer, "null"], minimum: 0}
        trainingMinutes: {type: [integer, "null"], minimum: 0}
        stretchingMinutes: {type: [integer, "null"], minimum: 0}
        cardioMinutes: {type: [integer, "null"], minimum: 0}
        plannedSessionName: {type: [string, "null"], maxLength: 100}
        plannedTargets: {type: [array, "null"], items: {$ref: "#/components/schemas/RecordedPlanTargetSnapshot"}, description: Immutable target snapshots copied from the recording, not a live-plan edit.}
        recordingKey: {type: [string, "null"], format: uuid, description: Required for create; generate once and reuse only for an identical retry. On update, preserve the read key exactly, including null for legacy records.}
        saunaSession: {type: boolean}
        saunaRoundsMinutes: {type: [array, "null"], minItems: 1, items: {type: integer, minimum: 1}, description: Actual ordered round minutes; required when saunaSession is true, including sauna-only logs.}
        plannedSaunaRoundsMinutes: {type: [array, "null"], items: {type: integer, minimum: 1}, description: Optional immutable plan snapshot, never substituted for actual rounds.}
    CoachWorkoutLineWrite:
      type: object
      additionalProperties: false
      required: [exerciseId, segments]
      properties:
        exerciseId: {type: integer, format: int64, minimum: 1, description: Use an ID from getActivePlan(WORKOUT, exerciseQuery=matching name); read-only workout context names are not IDs.}
        calories: {type: [integer, "null"], minimum: 0}
        averageHeartRate: {type: [integer, "null"], minimum: 0}
        segments: {type: array, minItems: 1, items: {$ref: "#/components/schemas/CoachWorkoutSegmentWrite"}}
        stretchingUnit: {type: [string, "null"], enum: [SECONDS, BREATHS, null]}
        supersetGroupId: {type: [string, "null"], maxLength: 36}
        exerciseDurationSeconds: {type: [integer, "null"], minimum: 0, description: Exact measured exercise seconds, distinct from session minutes.}
    CoachWorkoutSegmentWrite:
      type: object
      additionalProperties: false
      properties:
        repetitions: {type: [integer, "null"], minimum: 1}
        durationSeconds: {type: [integer, "null"], minimum: 1}
        weight: {type: [number, "null"], minimum: 0}
        speedKph: {type: [number, "null"], minimum: 0}
        distanceKm: {type: [number, "null"], minimum: 0}
        inclinePercent: {type: [number, "null"], minimum: 0}
        resistanceLevel: {type: [integer, "null"], minimum: 0}
        breaths: {type: [integer, "null"], minimum: 1}
        cadenceRpm: {type: [number, "null"], minimum: 0}
        skipped: {type: boolean, description: Preserve explicit skipped sets and intervals; do not treat them as completed work.}
    WarningType:
      type: string
      enum: [RECOVERY_STRAIN, SLEEP_DISRUPTION, MOOD_DECLINE, ROUTINE_DISRUPTION, NUTRITION_IMBALANCE, TRAINING_STRAIN, PAIN_INCREASE, HEALTH_CHANGE]
    WarningContent:
      type: object
      required: [explanation, evidence, action, reviewedDate]
      properties:
        explanation: {type: string, minLength: 1, maxLength: 2000}
        evidence: {type: string, minLength: 1, maxLength: 4000, description: Concise dated observations and baseline comparison with uncertainty.}
        action: {type: string, minLength: 1, maxLength: 500}
        onsetDate: {type: string, format: date, nullable: true}
        reviewedDate: {type: string, format: date}
    CreateWarningRequest:
      type: object
      required: [requestKey, type, content]
      properties:
        requestKey: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/WarningType"}
        content: {$ref: "#/components/schemas/WarningContent"}
    UpdateWarningRequest:
      type: object
      required: [version, content]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        content: {$ref: "#/components/schemas/WarningContent"}
    ResolveWarningRequest:
      type: object
      required: [version, reviewedDate, rationale]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reviewedDate: {type: string, format: date}
        rationale: {type: string, minLength: 1, maxLength: 2000}
    WarningResponse:
      type: object
      required: [id, type, status, content, createdAt, updatedAt, version]
      properties:
        id: {type: integer, format: int64}
        type: {$ref: "#/components/schemas/WarningType"}
        status: {type: string, enum: [ACTIVE, RESOLVED]}
        content: {$ref: "#/components/schemas/WarningContent"}
        resolutionRationale: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
    WarningWriteRequest:
      type: object
      description: Exactly one create, update or resolve payload. id is required for update or resolve and omitted for create.
      properties:
        id: {type: integer, format: int64, minimum: 1}
        create: {$ref: "#/components/schemas/CreateWarningRequest"}
        update: {$ref: "#/components/schemas/UpdateWarningRequest"}
        resolve: {$ref: "#/components/schemas/ResolveWarningRequest"}
    WarningReadResponse:
      type: object
      required: [items, page, hasMore, hasHistory]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/WarningResponse"}}
        page: {type: integer}
        hasMore: {type: boolean}
        hasHistory: {type: boolean}

  parameters:
    HealthEntryType:
      name: type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/HealthEntryType"
    CoachFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    CoachTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
security:
  - BearerAuth: []
