services:
  caddy:
    image: caddy:2.10
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VUE_APP_GOOGLE_CLIENT_ID: ${VUE_APP_GOOGLE_CLIENT_ID:-replace-with-your-google-client-id}
        VUE_APP_CHATGPT_COACH_URL: ${VUE_APP_CHATGPT_COACH_URL:-https://chatgpt.com/gpts/mine}
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-weight_control}
      DB_USER: ${DB_USER:-weight_control}
      DB_PASSWORD: ${DB_PASSWORD:-weight_control}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-replace-with-a-long-random-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-with-your-google-client-id}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost}
      CHATGPT_ACTION_TOKEN: ${CHATGPT_ACTION_TOKEN:-}
      CHATGPT_ACTION_USER_EMAIL: ${CHATGPT_ACTION_USER_EMAIL:-jllado@gmail.com}
      APP_PUSH_ENABLED: ${APP_PUSH_ENABLED:-false}
      APP_VAPID_PUBLIC_KEY: ${APP_VAPID_PUBLIC_KEY:-}
      APP_VAPID_PRIVATE_KEY: ${APP_VAPID_PRIVATE_KEY:-}
      APP_VAPID_SUBJECT: ${APP_VAPID_SUBJECT:-mailto:jllado@gmail.com}
      APP_PUSH_RELEASE_TOKEN: ${APP_PUSH_RELEASE_TOKEN:-}
      APP_WEEKLY_SUMMARY_ENABLED: ${APP_WEEKLY_SUMMARY_ENABLED:-false}
      APP_WEEKLY_SUMMARY_OWNER_EMAIL: ${APP_WEEKLY_SUMMARY_OWNER_EMAIL:-jllado@gmail.com}
      APP_WEEKLY_SUMMARY_RECIPIENT_EMAIL: ${APP_WEEKLY_SUMMARY_RECIPIENT_EMAIL:-jllado@gmail.com}
      APP_WEEKLY_SUMMARY_SENDER_EMAIL: ${APP_WEEKLY_SUMMARY_SENDER_EMAIL:-}
      APP_WEEKLY_SUMMARY_APP_URL: ${APP_WEEKLY_SUMMARY_APP_URL:-http://localhost:8080}
      MAILGUN_SMTP_HOST: ${MAILGUN_SMTP_HOST:-smtp.eu.mailgun.org}
      MAILGUN_SMTP_PORT: ${MAILGUN_SMTP_PORT:-587}
      MAILGUN_SMTP_USERNAME: ${MAILGUN_SMTP_USERNAME:-}
      MAILGUN_SMTP_PASSWORD: ${MAILGUN_SMTP_PASSWORD:-}
    volumes:
      - backend_data:/data
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-weight_control}
      MARIADB_USER: ${DB_USER:-weight_control}
      MARIADB_PASSWORD: ${DB_PASSWORD:-weight_control}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-weight_control_root}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
  backend_data:
  caddy_data:
  caddy_config:
