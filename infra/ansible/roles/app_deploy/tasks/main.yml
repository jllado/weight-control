---
- name: Ensure rsync is installed
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Ensure shared edge network exists
  ansible.builtin.command:
    cmd: docker network inspect {{ shared_edge_network_name }}
  register: shared_edge_network_inspect
  changed_when: false
  failed_when: shared_edge_network_inspect.rc not in [0, 1]

- name: Create shared edge network
  ansible.builtin.command:
    cmd: docker network create {{ shared_edge_network_name }}
  when: shared_edge_network_inspect.rc == 1

- name: Synchronize project to server
  become: false
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ app_dir }}/"
    delete: true
    use_ssh_args: true
    rsync_opts: "{{ deploy_sync_excludes | map('regex_replace', '^(.*)$', '--exclude=\\1') | list }}"
  delegate_to: localhost

- name: Verify frontend release artifact exists
  become: false
  ansible.builtin.stat:
    path: "{{ release_artifact_worktree }}/dist/index.html"
  register: frontend_release_artifact
  delegate_to: localhost

- name: Verify backend release artifact exists
  become: false
  ansible.builtin.find:
    paths: "{{ release_artifact_worktree }}/backend/build/libs"
    patterns: "*.jar"
    file_type: file
    recurse: false
  register: backend_release_artifacts
  delegate_to: localhost

- name: Require complete release artifacts
  ansible.builtin.assert:
    that:
      - frontend_release_artifact.stat.exists
      - backend_release_artifacts.matched == 1
    fail_msg: Build the release artifacts before deploying the application.

- name: Ensure release artifact directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}/dist"
    - "{{ app_dir }}/backend/build/libs"

- name: Synchronize frontend release artifact
  become: false
  ansible.posix.synchronize:
    src: "{{ release_artifact_worktree }}/dist/"
    dest: "{{ app_dir }}/dist/"
    delete: true
    use_ssh_args: true
  delegate_to: localhost

- name: Synchronize backend release artifact
  become: false
  ansible.posix.synchronize:
    src: "{{ release_artifact_worktree }}/backend/build/libs/"
    dest: "{{ app_dir }}/backend/build/libs/"
    delete: true
    use_ssh_args: true
  delegate_to: localhost

- name: Render application environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0600"
  no_log: true

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ app_dir }}/Caddyfile"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0644"
  register: rendered_caddyfile

- name: Build docker compose file arguments
  ansible.builtin.set_fact:
    docker_compose_file_args: "{{ app_compose_files | map('regex_replace', '^(.*)$', '-f ' ~ app_dir ~ '/\\1') | join(' ') }}"

- name: Validate application compose configuration
  ansible.builtin.command:
    cmd: docker compose {{ docker_compose_file_args }} config
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Start application stack
  ansible.builtin.command:
    cmd: docker compose {{ docker_compose_file_args }} up -d --build
    chdir: "{{ app_dir }}"
  register: docker_compose_up
  changed_when: "'Started' in docker_compose_up.stdout or 'Recreated' in docker_compose_up.stdout or 'Created' in docker_compose_up.stdout or 'Building' in docker_compose_up.stdout"

- name: Reload changed Caddy configuration
  ansible.builtin.command:
    cmd: docker compose {{ docker_compose_file_args }} exec -T caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ app_dir }}"
  when: rendered_caddyfile.changed

- name: Show concise compose result
  ansible.builtin.debug:
    msg: "{{ (docker_compose_up.stdout_lines | default([]))[-8:] }}"
