---
app_dir: /opt/weight-control
app_owner: deploy
app_group: deploy

app_domains:
  - weightcontrol.devjllado.com

app_allowed_origins:
  - https://weightcontrol.devjllado.com

app_db_name: weight_control
app_db_user: weight_control
app_db_password: change-this-db-password
app_db_root_password: change-this-root-db-password
app_jwt_secret: change-this-to-a-long-random-secret
app_google_client_id: 594571928091-q7evumappf4uob4i5ickmjg5ag9g6uhf.apps.googleusercontent.com
app_chatgpt_action_token: "{{ lookup('ansible.builtin.env', 'CHATGPT_ACTION_TOKEN') }}"
app_chatgpt_action_user_email: jllado@gmail.com
app_chatgpt_coach_url: "{{ lookup('ansible.builtin.env', 'VUE_APP_CHATGPT_COACH_URL') }}"
app_push_enabled: true
app_vapid_public_key: "{{ lookup('ansible.builtin.env', 'APP_VAPID_PUBLIC_KEY') }}"
app_vapid_private_key: "{{ lookup('ansible.builtin.env', 'APP_VAPID_PRIVATE_KEY') }}"
app_vapid_subject: mailto:jllado@gmail.com
app_push_release_token: "{{ lookup('ansible.builtin.env', 'APP_PUSH_RELEASE_TOKEN') }}"
app_weekly_summary_enabled: true
app_weekly_summary_owner_email: jllado@gmail.com
app_weekly_summary_recipient_email: jllado@gmail.com
app_weekly_summary_sender_email: weightcontrol@devjllado.com
app_weekly_summary_app_url: "https://{{ app_domains | first }}"
mailgun_smtp_host: smtp.eu.mailgun.org
mailgun_smtp_port: 587
mailgun_smtp_username: weightcontrol@devjllado.com
mailgun_smtp_password: "{{ lookup('ansible.builtin.env', 'MAILGUN_SMTP_PASSWORD') }}"
app_import_enabled: true
app_secure_cookie: true
app_compose_files:
  - docker-compose.yml
  - docker-compose.shared-gateway.yml
shared_edge_network_name: shared_edge
app_caddy_site_address: ":80"
compose_project_name: weight-control
app_caddy_http_port: 80
app_caddy_https_port: 443

deploy_sync_excludes:
  - .git/
  - .env
  - .idea/
  - .vscode/
  - node_modules/
  - dist/
  - backend/build/
  - .venv-ansible/
  - infra/ansible/.venv-ansible/
  - infra/ansible/inventory.ini
