---
server_timezone: Europe/Madrid

base_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - fail2ban
  - git
  - htop
  - jq
  - python3-pip
  - software-properties-common
  - ufw
  - unattended-upgrades

admin_user: deploy
admin_group: deploy
admin_shell: /bin/bash
admin_ssh_public_keys:
  - "ssh-rsa  jllado@jllado-OMEN"

ufw_allowed_tcp_ports:
  - 22
  - 80
  - 443

filesystem_directories:
  - path: /opt/weight-control
    owner: deploy
    group: deploy
    mode: "0755"
  - path: /opt/backups
    owner: root
    group: root
    mode: "0755"

docker_apt_arch: amd64

app_dir: /opt/weight-control
app_owner: deploy
app_group: deploy

app_domains:
  - weightcontrol.devjllado.com

app_allowed_origins:
  - https://weightcontrol.devjllado.com

app_db_name: weight_control
app_db_user: weight_control
app_db_password: change-this-db-password
app_db_root_password: change-this-root-db-password
app_jwt_secret: change-this-to-a-long-random-secret
app_google_client_id: 594571928091-q7evumappf4uob4i5ickmjg5ag9g6uhf.apps.googleusercontent.com
app_chatgpt_action_token: "{{ lookup('ansible.builtin.env', 'CHATGPT_ACTION_TOKEN') }}"
app_chatgpt_action_user_email: jllado@gmail.com
app_chatgpt_reflection_url: https://chatgpt.com/gpts/mine
app_import_enabled: true
app_secure_cookie: true
app_compose_files:
  - docker-compose.yml
  - docker-compose.shared-gateway.yml
shared_edge_network_name: shared_edge
app_caddy_site_address: ":80"
compose_project_name: weight-control
app_caddy_http_port: 80
app_caddy_https_port: 443

deploy_sync_excludes:
  - .git/
  - .env
  - .idea/
  - .vscode/
  - node_modules/
  - dist/
  - backend/build/
  - .venv-ansible/
  - infra/ansible/.venv-ansible/
  - infra/ansible/inventory.ini
