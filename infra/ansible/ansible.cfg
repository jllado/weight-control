[defaults]
inventory = inventory.ini
host_key_checking = True
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=2
retries = 6

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
