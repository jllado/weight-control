spring:
  application:
    name: weight-control-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weight_control}
    username: ${DB_USER:weight_control}
    password: ${DB_PASSWORD:weight_control}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAILGUN_SMTP_HOST:smtp.eu.mailgun.org}
    port: ${MAILGUN_SMTP_PORT:587}
    username: ${MAILGUN_SMTP_USERNAME:}
    password: ${MAILGUN_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    include-message: always

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    jwt-secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
    jwt-expiration-days: 7
    secure-cookie: ${APP_SECURE_COOKIE:false}
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:48080}
  storage:
    root: ${APP_STORAGE_ROOT:./data}
  chat-gpt-actions:
    token: ${CHATGPT_ACTION_TOKEN:}
    user-email: ${CHATGPT_ACTION_USER_EMAIL:jllado@gmail.com}
    public-base-url: ${CHATGPT_ACTION_PUBLIC_BASE_URL}
    file-signing-secret: ${CHATGPT_FILE_SIGNING_SECRET}
  push:
    enabled: ${APP_PUSH_ENABLED:false}
    public-key: ${APP_VAPID_PUBLIC_KEY:}
    private-key: ${APP_VAPID_PRIVATE_KEY:}
    subject: ${APP_VAPID_SUBJECT:mailto:jllado@gmail.com}
    release-token: ${APP_PUSH_RELEASE_TOKEN:}
  weekly-summary:
    enabled: ${APP_WEEKLY_SUMMARY_ENABLED:false}
    owner-email: ${APP_WEEKLY_SUMMARY_OWNER_EMAIL:jllado@gmail.com}
    recipient-email: ${APP_WEEKLY_SUMMARY_RECIPIENT_EMAIL:jllado@gmail.com}
    sender-email: ${APP_WEEKLY_SUMMARY_SENDER_EMAIL:}
    app-url: ${APP_WEEKLY_SUMMARY_APP_URL:http://localhost:8080}
