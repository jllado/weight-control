spring:
  application:
    name: weight-control-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weight_control}
    username: ${DB_USER:weight_control}
    password: ${DB_PASSWORD:weight_control}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  error:
    include-message: always

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    jwt-secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
    jwt-expiration-days: 7
    secure-cookie: ${APP_SECURE_COOKIE:false}
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:48080}
  storage:
    root: ${APP_STORAGE_ROOT:./data}
  chat-gpt-actions:
    token: ${CHATGPT_ACTION_TOKEN:}
    user-email: ${CHATGPT_ACTION_USER_EMAIL:jllado@gmail.com}
  push:
    enabled: ${APP_PUSH_ENABLED:false}
    public-key: ${APP_VAPID_PUBLIC_KEY:}
    private-key: ${APP_VAPID_PRIVATE_KEY:}
    subject: ${APP_VAPID_SUBJECT:mailto:jllado@gmail.com}
    release-token: ${APP_PUSH_RELEASE_TOKEN:}
